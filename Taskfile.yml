version: '3'

vars:
  VERSION: '{{.VERSION | default "dev"}}'
  GHOSTTY_PREFIX: '{{.GHOSTTY_PREFIX | default (printf "%s/.deps/libghostty-vt" .ROOT_DIR)}}'

env:
  CGO_ENABLED: '1'
  GHOSTTY_PREFIX: '{{.GHOSTTY_PREFIX}}'
  PKG_CONFIG: '{{.PKG_CONFIG | default (printf "%s/scripts/pkg-config.sh" .ROOT_DIR)}}'
  PKG_CONFIG_PATH: '{{.GHOSTTY_PREFIX}}/share/pkgconfig{{if .PKG_CONFIG_PATH}}:{{.PKG_CONFIG_PATH}}{{end}}'

tasks:
  default:
    cmds: [task: build]
  list:
    desc: List available tasks
    cmds: [task --list]
  deps:
    desc: Bootstrap pinned Zig/pkgconf and build libghostty-vt locally (pass build flags after --)
    cmds: ['sh scripts/build-libghostty.sh {{.CLI_ARGS}}']
  native-check:
    internal: true
    run: once
    cmds:
      - 'if ! "$PKG_CONFIG" --exists --static libghostty-vt-static 2>/dev/null; then sh scripts/build-libghostty.sh; fi'
  terminfo:
    desc: Regenerate internal/terminfo from the pinned Ghostty revision (needs tic)
    cmds: ['sh scripts/terminfo.sh']
  build:
    desc: Build bin/ntrecord
    deps: [native-check]
    # Let Go handle caching: native libraries, compiler flags, and workspace
    # dependencies can change outside Task's source globs.
    env:
      NTRECORD_VERSION: '{{.VERSION}}'
    cmds: ['go build -mod=readonly -trimpath -ldflags "-X main.version=$NTRECORD_VERSION" -o bin/ntrecord .']
  run:
    desc: Run ntrecord (pass a tape path or CLI arguments after --)
    interactive: true
    deps: [build]
    cmds: ['bin/ntrecord {{.CLI_ARGS}}']
  play:
    desc: Play an asciicast in a Kitty-capable terminal
    interactive: true
    deps: [build]
    cmds: ['bin/ntrecord play {{.CLI_ARGS}}']
  record:
    desc: Record a live PTY (pass recorder flags and command after --)
    interactive: true
    deps: [build]
    cmds: ['bin/ntrecord record {{.CLI_ARGS}}']
  install:
    desc: Install ntrecord into the Go bin directory
    deps: [native-check]
    cmds: [go install -mod=readonly -trimpath .]
  clean:
    desc: Remove binaries, release archives, and Task state (keep dependencies and recordings)
    cmds: [rm -rf bin dist .task]
  clean:all:
    desc: Also remove project-local tools, native libraries, downloads, and Zig caches
    cmds:
      - task: clean
      - rm -rf .deps
  fmt:
    desc: Format Go sources
    cmds: [gofmt -w ./*.go internal examples render gifencode asciicast skills testdata/library]
  fmt-check:
    desc: Check Go formatting
    cmds:
      - 'files=$(gofmt -l ./*.go internal examples render gifencode asciicast skills testdata/library); if [ -n "$files" ]; then printf "%s\n" "$files"; exit 1; fi'
  go-tidy:
    desc: Tidy module dependencies
    cmds: [go mod tidy]
  go-tidy-check:
    cmds: [go mod tidy -diff]
  go-verify:
    cmds: [go mod verify]
  test:
    desc: Run tests (pass go test flags after --)
    deps: [native-check]
    cmds: ['go test -mod=readonly {{.CLI_ARGS}} ./...']
  test:library:
    desc: Verify public packages from an external module, with and without cgo
    deps: [native-check]
    cmds: [sh scripts/test-library.sh]
  video-check:
    internal: true
    preconditions:
      - sh: command -v ffmpeg && command -v ffprobe
        msg: 'Video tests require FFmpeg (macOS: brew install ffmpeg; Debian/Ubuntu: sudo apt-get install ffmpeg).'
  test:video:
    desc: Require FFmpeg and run video encoder and PTY integration tests
    deps: [native-check, video-check]
    env:
      NTRECORD_REQUIRE_FFMPEG: '1'
    cmds: ['go test -mod=readonly {{.CLI_ARGS}} . ./internal/encode']
  test:shaders:
    desc: Record ntcharts shaders and check every GIF frame (requires GPU and SHADERS_BIN)
    requires:
      vars: [SHADERS_BIN]
    deps: [native-check]
    env:
      NTRECORD_SHADER_BIN: '{{.SHADERS_BIN}}'
      NTRECORD_SHADER_OUTPUT: '{{.OUTPUT | default "examples/shaders.gif"}}'
    cmds: [go test -mod=readonly -count=1 -run '^TestNTChartsShaderContinuity$' -v .]
  test:golden:
    desc: Check the renderer's golden frames, as CI does on four platforms (see docs/development.md)
    deps: [native-check]
    cmds: ['go test -mod=readonly -count=1 -run "Golden|FaceMatches" {{.CLI_ARGS}} ./render']
  test:fma:
    desc: Re-run the golden frames with FMA fusion off, imitating amd64 arithmetic on arm64
    deps: [native-check]
    cmds: ['sh scripts/test-fma.sh']
  test-race:
    desc: Run tests with race detection
    deps: [native-check]
    cmds: ['go test -mod=readonly -race {{.CLI_ARGS}} ./...']
  vet:
    desc: Run Go static checks
    deps: [native-check]
    cmds: [go vet -mod=readonly ./...]
  ci:
    desc: Run the same checks as GitHub Actions
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: go-verify
      - task: test-race
      - task: test:library
      - task: vet
      - task: build
  demo:kitty:
    desc: Record examples/kitty.gif (direct PNG with a query handshake)
    deps: [build]
    cmds: [bin/ntrecord examples/kitty.tape]
  demo:text:
    desc: Record examples/text.gif
    deps: [build]
    cmds: [bin/ntrecord examples/text.tape]
  demo:placeholder:
    desc: Record examples/kitty-placeholder.gif (ntcharts-style Unicode placements)
    deps: [build]
    cmds: [bin/ntrecord examples/kitty-placeholder.tape]
  demos:
    desc: Record the example GIFs
    cmds:
      - task: demo:kitty
      - task: demo:text
      - task: demo:placeholder
  demo:video:
    desc: Record Kitty graphics to MP4 and WebM (requires FFmpeg)
    deps: [build, video-check]
    cmds:
      - bin/ntrecord examples/kitty-mp4.tape
      - bin/ntrecord examples/kitty-webm.tape
  demo:language:
    desc: Record the VHS language demo, text checkpoints, and PNG screenshot
    deps: [build]
    cmds: [bin/ntrecord examples/language.tape]

  docs:hugo:serve:
    desc: Serve the user guide while editing it (needs hugo, extended; run `git submodule update --init` once)
    dir: docs/hugo
    cmds: [hugo serve]
  docs:hugo:build:
    desc: Build the user guide into docs/hugo/public (pass hugo flags after --)
    dir: docs/hugo
    cmds: ['hugo --minify {{.CLI_ARGS}}']
  docs:clean:
    desc: Remove the built user guide
    cmds: [rm -rf docs/hugo/public docs/hugo/resources]

  release:
    desc: Package a snapshot in dist on macOS, publishing nothing
    env:
      GOWORK: 'off'
    cmds: [goreleaser release --snapshot --clean --skip=notarize]
  release-check:
    desc: Check the GoReleaser configuration
    cmds: [goreleaser check]
